services:
  traefik:
    image: traefik:v3.0
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.http.address=:8000"
    ports:
      - "8001:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - mired

  extractor:
    image: pdf-extractext-extractor:v${VERSION:-0.1.0}
    build: .
    restart: unless-stopped
    read_only: true
    stop_grace_period: 30s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    tmpfs: ["/tmp:size=8m,mode=1777"]
    environment:
      - TZ=${TZ:-America/Argentina/Mendoza}
      - HTTP_PORT=8080
      - MAX_IN_FLIGHT=2
      - MAX_QUEUE=50
      - QUEUE_WAIT_TIMEOUT=25s
      - EXTRACT_TIMEOUT=15s
      - CACHE_TTL=${CACHE_TTL:-5m}
      - RATE_LIMIT_RPS=${RATE_LIMIT_RPS:-0}
      - GOMEMLIMIT=800MiB          # ~80 % del límite del cgroup
      - GOMAXPROCS=1
      - MAX_DOCUMENT_BYTES=20971520
      - CONSUL_HTTP_ADDR=${CONSUL_HTTP_ADDR:-}
      - SERVICE_NAME=extractor
    healthcheck:
      test: ["CMD", "/extractor", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

    networks:
      - mired
    deploy:
      replicas: 5
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
          pids: 128
    labels:
      - traefik.enable=true
      - traefik.http.routers.extractor.rule=PathPrefix(`/extract`) || PathPrefix(`/health`) || PathPrefix(`/ready`) || Host(`extract.universidad.localhost`) || Host(`extractor.internal`)
      - traefik.http.routers.extractor.entrypoints=http
      - traefik.http.services.extractor.loadbalancer.server.port=8080
      - traefik.http.services.extractor.loadbalancer.healthcheck.path=/ready
      - traefik.http.services.extractor.loadbalancer.healthcheck.interval=3s

networks:
  mired:
    name: mired