services:
  extractor:
    image: pdf-extractext-extractor:v${VERSION:-0.1.0}
    build: .
    restart: unless-stopped
    read_only: true
    stop_grace_period: 30s
    environment:
      - TZ=${TZ:-America/Argentina/Mendoza}
      - HTTP_PORT=8080
      - MAX_IN_FLIGHT=2
      - MAX_QUEUE=50
      - QUEUE_WAIT_TIMEOUT=25s
      - EXTRACT_TIMEOUT=15s
    networks:
      - mired
    deploy:
      replicas: 5
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    labels:
      - traefik.enable=true
      - traefik.edge=internal
      - traefik.docker.network=mired
      - traefik.http.routers.extractor.rule=Host(`extractor.internal`)
      - traefik.http.routers.extractor.entrypoints=http
      - traefik.http.routers.extractor.middlewares=int-ratelimit@file,int-cb@file,int-retry@file
      - traefik.http.services.extractor.loadbalancer.server.port=8080

networks:
  mired:
    external: true